<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --primary-dark: #0D47A1;
            --primary-light: #64B5F6;
            --background-color: #121212;
            --surface-1: #1E1E1E;
            --surface-2: #2D2D2D;
            --text-primary: #E0E0E0;
            --text-secondary: #9E9E9E;
            --border-color: #333333;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.4);
            --transition-normal: all 0.3s ease;
            --transition-slow: all 0.5s ease;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        header {
            background-color: var(--primary-dark);
            color: white;
            width: 100%;
            text-align: center;
            padding: 1.5rem 0;
            box-shadow: var(--shadow-md);
        }
        
        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 2rem auto;
        }
        
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        
        input {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            background-color: var(--surface-2);
            color: var(--text-primary);
            transition: var(--transition-normal);
        }
        
        input:focus {
            border-color: var(--primary-color);
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0 1.5rem;
            cursor: pointer;
            transition: var(--transition-normal);
            font-size: 16px;
        }
        
        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .weather-card {
            display: none;
            background-color: var(--surface-1);
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            box-shadow: var(--shadow-md);
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .city-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .city-name {
            font-size: 1.8rem;
            font-weight: 500;
        }
        
        .country {
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .date-time {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }
        
        .temperature {
            font-size: 3rem;
            font-weight: 300;
        }
        
        .condition {
            text-align: center;
            font-size: 1.2rem;
        }
        
        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
        }
        
        .detail-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-right: 8px;
        }
        
        .detail-value {
            font-weight: 500;
        }
        
        /* Forecast Section Styles */
        .forecast-container {
            display: none;
            margin-top: 2.5rem;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }
        
        .forecast-cards {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0.5rem 0 1.5rem 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--surface-2);
        }
        
        .forecast-cards::-webkit-scrollbar {
            height: 6px;
        }
        
        .forecast-cards::-webkit-scrollbar-track {
            background: var(--surface-2);
            border-radius: 10px;
        }
        
        .forecast-cards::-webkit-scrollbar-thumb {
            background-color: var(--primary-color);
            border-radius: 10px;
        }
        
        .forecast-card {
            min-width: 140px;
            background-color: var(--surface-1);
            border-radius: 10px;
            padding: 1.2rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-normal);
            border-left: 3px solid var(--primary-color);
            flex-shrink: 0;
        }
        
        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        
        .forecast-date {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .forecast-day {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            text-align: center;
        }
        
        .forecast-icon {
            text-align: center;
            margin: 0.8rem 0;
        }
        
        .forecast-icon img {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
        }
        
        .forecast-condition {
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
        }
        
        .forecast-temp {
            display: flex;
            justify-content: space-between;
            margin: 0.7rem 0;
        }
        
        .forecast-temp-max {
            color: var(--primary-light);
            font-weight: 500;
        }
        
        .forecast-temp-min {
            color: var(--text-secondary);
        }
        
        .forecast-detail {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
        
        .rain-chance {
            display: flex;
            align-items: center;
        }
        
        .loading {
            display: none;
            justify-content: center;
            padding: 1rem;
            color: var(--text-secondary);
        }
        
        .error {
            display: none;
            color: #F44336;
            padding: 0.8rem;
            margin: 1rem 0;
            text-align: center;
            background-color: rgba(244, 67, 54, 0.1);
            border-radius: 4px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        footer {
            margin-top: auto;
            padding: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                width: 95%;
                margin: 1rem auto;
            }
            
            .forecast-card {
                min-width: 120px;
                padding: 1rem;
            }
            
            .weather-main {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Weather Forecast</h1>
    </header>
    
    <div class="container">
        <div class="search-box">
            <input id="cityInput" type="text" placeholder="Enter city name..." aria-label="City name">
            <button onclick="getWeather()">Search</button>
        </div>
        
        <div id="loading" class="loading">
            Fetching weather data...
        </div>
        
        <div id="error" class="error"></div>
        
        <!-- Current Weather Card -->
        <div id="weatherCard" class="weather-card">
            <div class="city-header">
                <div>
                    <div id="cityName" class="city-name">-</div>
                    <div id="country" class="country">-</div>
                </div>
                <div id="dateTime" class="date-time">-</div>
            </div>
            
            <div class="weather-main">
                <div class="temperature" id="temperature">-°C</div>
                <div class="condition-container">
                    <div id="condition" class="condition">-</div>
                    <div id="feelsLike" class="feels-like">Feels like: -°C</div>
                </div>
            </div>
            
            <div class="details">
                <div class="detail-item">
                    <span class="detail-label">Humidity:</span>
                    <span id="humidity" class="detail-value">-%</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Wind Speed:</span>
                    <span id="windSpeed" class="detail-value">- km/h</span>
                </div>
            </div>
        </div>
        
        <!-- Weekly Forecast Section -->
        <div id="forecastContainer" class="forecast-container">
            <h2 class="section-title">7-Day Forecast</h2>
            <div id="forecast-loading" class="loading">Loading forecast data...</div>
            <div id="forecast-error" class="error"></div>
            <div id="weekly-forecast" class="forecast-cards">
                <!-- Forecast cards will be inserted here by JavaScript -->
            </div>
        </div>
    </div>
    
    <footer>
        Weather data provided by WeatherAPI.com | © 2025 Weather Forecast
    </footer>
    
    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            // Uncomment and enhance this empty input validation
            if (!city) {
                showError('Please enter a city name');
                hideWeatherCard();
                hideForecastContainer();
                return;
            }
            
            // Fetch current weather
            try {
                showLoading(true);
                hideError();
                hideWeatherCard();
                hideForecastContainer();
                
                const response = await fetch(`/weather/current?city=${encodeURIComponent(city)}`);
                
                if (!response.ok) {
                    // Better handling of specific error status codes
                    if (response.status === 404) {
                        throw new Error('City not found');
                    } else {
                        const errorText = await response.text();
                        // Try to parse as JSON for structured error
                        try {
                            const errorData = JSON.parse(errorText);
                            throw new Error(errorData.message || `Error: ${response.status}`);
                        } catch (jsonError) {
                            throw new Error(`Error: ${response.status}`);
                        }
                    }
                }
                
                const data = await response.json();
                displayWeatherData(data);
                
                // Also fetch and display forecast
                getWeeklyForecast(city);
                
            } catch (error) {
                showError(error.message);
                console.error("Detailed error:", error);
            } finally {
                showLoading(false);
            }
        }
        
        async function getWeeklyForecast(city) {
            try {
                showForecastLoading(true);
                hideForecastError();
                
                const response = await fetch(`/weather/forecast?city=${encodeURIComponent(city)}`);
                
                if (!response.ok) {
                    // Better handling of specific error status codes
                    if (response.status === 404) {
                        throw new Error('City not found');
                    } else {
                        const errorText = await response.text();
                        // Try to parse as JSON for structured error
                        try {
                            const errorData = JSON.parse(errorText);
                            throw new Error(errorData.message || `Error: ${response.status}`);
                        } catch (jsonError) {
                            throw new Error(`Error: ${response.status}`);
                        }
                    }
                }
                
                const data = await response.json();
                displayWeeklyForecast(data);
            } catch (error) {
                showForecastError(error.message);
                console.error("Forecast error:", error);
            } finally {
                showForecastLoading(false);
            }
        }
        
        function displayWeatherData(data) {
            document.getElementById('cityName').textContent = data.cityName || data.city;
            document.getElementById('country').textContent = data.country;
            document.getElementById('dateTime').textContent = formatDateTime(data.localTime || data.localtime);
            document.getElementById('temperature').textContent = `${Math.round(data.temperature)}°C`;
            document.getElementById('condition').textContent = data.condition;
            document.getElementById('feelsLike').textContent = `Feels like: ${Math.round(data.feelsLike || data.feels_like)}°C`;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.windSpeed || data.wind_speed} km/h`;
            
            showWeatherCard();
        }
        
        function displayWeeklyForecast(data) {
            const forecastContainer = document.getElementById('weekly-forecast');
            forecastContainer.innerHTML = '';
            
            // Debug: Log the received data
            console.log("Weekly forecast data received:", data);
            
            // Check if data exists in the expected format
            if (!data || !data.forecast || !Array.isArray(data.forecast) || data.forecast.length === 0) {
                showForecastError("No forecast data available or invalid format");
                console.error("Invalid forecast data format:", data);
                return;
            }
            
            // Get day names for formatting
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            
            data.forecast.forEach((day, index) => {
                // Debug: Log each day's data
                console.log(`Day ${index} data:`, day);
                
                // Parse the date to get day name
                const dateObj = new Date(day.date);
                const dayName = days[dateObj.getDay()];
                const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                
                // Create forecast card
                const card = document.createElement('div');
                card.className = 'forecast-card';
                
                // Fix icon URL if needed
                const iconUrl = day.conditionIcon?.startsWith('//') 
                    ? `https:${day.conditionIcon}` 
                    : (day.conditionIcon || 'https://cdn.weatherapi.com/weather/64x64/day/116.png');
                
                // Safely access properties with fallbacks for any missing data
                const maxTemp = day.maxTemperature !== undefined ? Math.round(day.maxTemperature) : "--";
                const minTemp = day.minTemperature !== undefined ? Math.round(day.minTemperature) : "--";
                const condition = day.condition || "No data";
                const chanceOfRain = day.chanceOfRain !== undefined ? day.chanceOfRain : "--";
                const humidity = day.humidity !== undefined ? day.humidity : "--";
                
                card.innerHTML = `
                    <div class="forecast-day">${dayName}</div>
                    <div class="forecast-date">${formattedDate}</div>
                    <div class="forecast-icon">
                        <img src="${iconUrl}" alt="${condition}">
                    </div>
                    <div class="forecast-condition">${condition}</div>
                    <div class="forecast-temp">
                        <span class="forecast-temp-max">${maxTemp}°</span>
                        <span class="forecast-temp-min">${minTemp}°</span>
                    </div>
                    <div class="forecast-detail">
                        <div class="rain-chance">💧 ${chanceOfRain}%</div>
                        <div>${humidity}% hum</div>
                    </div>
                `;
                
                forecastContainer.appendChild(card);
            });
            
            showForecastContainer();
        }
        
        function formatDateTime(dateTimeStr) {
            const date = new Date(dateTimeStr);
            return date.toLocaleString('en-US', {
                weekday: 'short',
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        function showLoading(isLoading) {
            document.getElementById('loading').style.display = isLoading ? 'flex' : 'none';
        }
        
        function showForecastLoading(isLoading) {
            document.getElementById('forecast-loading').style.display = isLoading ? 'flex' : 'none';
        }
        
        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showForecastError(message) {
            const errorElement = document.getElementById('forecast-error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }
        
        function hideForecastError() {
            document.getElementById('forecast-error').style.display = 'none';
        }
        
        function showWeatherCard() {
            document.getElementById('weatherCard').style.display = 'block';
        }
        
        function hideWeatherCard() {
            document.getElementById('weatherCard').style.display = 'none';
        }
        
        function showForecastContainer() {
            document.getElementById('forecastContainer').style.display = 'block';
        }
        
        function hideForecastContainer() {
            document.getElementById('forecastContainer').style.display = 'none';
        }
        
        // Allow Enter key to trigger search
        document.getElementById('cityInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                getWeather();
            }
        });
    </script>
</body>
</html>
